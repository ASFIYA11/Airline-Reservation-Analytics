{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Add Passenger</title>

<link rel="stylesheet"
      href="{% static 'css/style.css' %}">

</head>

<body>

<div class="overlay">

<div class="container">

<h1>👤 Add Passenger</h1>

{% if message %}
<h2>{{ message }}</h2>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="text"
name="first_name"
placeholder="First Name"
required>

<br><br>

<input
type="text"
name="last_name"
placeholder="Last Name"
required>

<br><br>

<input
type="email"
name="email"
placeholder="Email"
required>

<br><br>

<input
type="text"
name="phone"
placeholder="Phone"
required>

<br><br>

<button type="submit">
Add Passenger
</button>

</form>

<br>

<a href="/">🏠 Home</a>

</div>

</div>

</body>
</html>
