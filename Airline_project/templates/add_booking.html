{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Add Booking</title>

<link rel="stylesheet"
      href="{% static 'css/style.css' %}">

</head>

<body>

<div class="overlay">

<div class="container">

<h1>🎫 Add Booking</h1>

{% if message %}
<h2>{{ message }}</h2>
{% endif %}

<form method="POST">

{% csrf_token %}

<input
type="number"
name="flight_id"
placeholder="Flight ID"
required>

<br><br>

<input
type="number"
name="passenger_id"
placeholder="Passenger ID"
required>

<br><br>

<input
type="text"
name="seat_number"
placeholder="Seat Number"
required>

<br><br>

<input
type="number"
step="0.01"
name="fare_paid"
placeholder="Fare Paid"
required>

<br><br>

<button type="submit">
Create Booking
</button>

</form>

<br>

<a href="/">🏠 Home</a>

</div>

</div>

</body>
</html>
